name: CI

# 신선한 환경에서 스킬들의 테스트·스크립트가 동작하는지 검증하는 회귀 게이트.
# (오토리서치 루프의 VERIFY 단계가 의존하는 자동 신호이기도 하다.)

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  expense-report:
    name: expense-report tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install dependencies
        working-directory: expense-report
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        working-directory: expense-report
        run: python -m pytest -q

  task-check:
    name: task-check tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pytest
        run: pip install pytest
      - name: Run tests
        working-directory: task-check
        run: python -m pytest -q

  autoresearch:
    name: autoresearch scripts tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pytest
        run: pip install pytest
      - name: Run unit tests
        working-directory: autoresearch
        run: python -m pytest -q
      - name: CLI smoke (loop_ledger + ab_score)
        run: |
          python autoresearch/scripts/loop_ledger.py --ledger /tmp/led.json start \
            --target ci --hypothesis "ci smoke"
          python autoresearch/scripts/loop_ledger.py --ledger /tmp/led.json status
          python autoresearch/scripts/ab_score.py template > /tmp/a.json
          cp /tmp/a.json /tmp/b.json
          python autoresearch/scripts/ab_score.py compare /tmp/a.json /tmp/b.json
